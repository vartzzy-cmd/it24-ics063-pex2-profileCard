<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Student Profile Card</h2>

    <div class="form">
        <input type="text" id="name" placeholder="Enter Student Name">
        <input type="text" id="course" placeholder="Enter Course">
        <input type="text" id="language" placeholder="Favorite Programming Language">

        <button id="create">Create Profile</button>
    </div>

    <div id="profile"></div>

    <div class="buttons">
        <button id="background">Change Background</button>
        <button id="addSkill">Add Skill</button>
        <button id="remove">Remove Profile</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
